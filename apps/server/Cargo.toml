[package]
name = "velio-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
deadpool-postgres = "0.14.2"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
lettre = { version = "0.11.23", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls",
  "rustls-platform-verifier",
  "aws-lc-rs",
] }
maud = "0.27.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rust-embed = { version = "8.14.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "time",
  "sync",
  "fs",
] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }
url = "2"

# Password hashing (bcrypt) is about 20 times slower unoptimized, which the
# tests feel with every sign-in; the server's own code stays quick to build.
[profile.dev.package."*"]
opt-level = 3

# Smaller and a little faster: the whole program optimized as one, and no
# symbols (a panic's message and backtrace still name the code, by address).
[profile.release]
codegen-units = 1
lto = "fat"
strip = true
